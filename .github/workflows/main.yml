name: AI Dream Generator
on:
  schedule:
    # 每天UTC时间00:01运行（北京时间08:01）
    - cron: '1 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  generate-dream:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pillow

    - name: Run dream generator
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        TONGYI_API_KEY: ${{ secrets.TONGYI_API_KEY }}
      run: |
        python generate_dream.py

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit and push if changes
      run: |
        # 检查是否有文件变化
        if git diff --quiet --exit-code; then
          echo "没有文件变化，跳过提交"
        else
          echo "有文件变化，准备提交"
          git add data/dreams.json assets/images/
          git commit -m "chore: Add dream for $(date +'%Y-%m-%d')"
          git push
        fi

    - name: Show changes
      run: |
        git status
        git diff --stat
